[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vista-bme"
version = "0.1.0"
description = "Sparse and streaming Bayesian Maximum Entropy with complex soft evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Ying-Fan Lin" },
  { name = "Hwa-Lung Yu" },
]
keywords = [
  "bayesian maximum entropy",
  "spatial statistics",
  "vecchia approximation",
  "soft data",
  "groundwater",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "six>=1.15",
]

[project.optional-dependencies]
cuda = ["torch>=2.6"]
dev = ["pytest>=7", "psutil>=5", "build>=1"]

[project.urls]
Homepage = "https://github.com/aar246860/vista-bme"
Repository = "https://github.com/aar246860/vista-bme"
Issues = "https://github.com/aar246860/vista-bme/issues"

[tool.setuptools.packages.find]
include = ["stamps*", "vista_bme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
